aid: fifth-wall
name: Fifth Wall
description: >-
  Fifth Wall is a venture capital firm founded in 2016 by Brendan F. Wallace and Brad Greiwe and
  headquartered in Los Angeles, California, with additional offices in New York, San Francisco, and
  London. It is the largest investment firm focused on technology for the built environment ("PropTech")
  and real estate, investing across the venture and growth stages into companies that make buildings and
  the physical world smarter, safer, more sustainable, and more energy efficient. The firm spans sub-themes
  including proptech, construction technology, residential real estate, fintech for real estate, smart
  buildings, logistics, and a dedicated climate/decarbonization strategy. Fifth Wall's distinctive model
  pairs its portfolio companies with a network of roughly 115 strategic limited partners — major real estate
  owner-operators such as CBRE, Hilton, Hines, Marriott, Public Storage, Related, and Starwood Capital — to
  drive strategic partnerships and distribution. With over $3 billion in assets under management and nearly
  170 portfolio companies, Fifth Wall has backed category leaders including Opendoor, Procore, ServiceTitan,
  Blend, Hippo, SmartRent, and Bilt Rewards.
